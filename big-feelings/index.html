<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>My Big Feelings Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Required sign-in gate (shared across the dashboard catalog) -->
  <script src="../auth-config.js"></script>
  <script src="../auth.js"></script>
  <style>
    :root {
      --sky: #7ec8f0;
      --sky-2: #a8e0ff;
      --sun: #ffd166;
      --grass: #8ed081;
      --ink: #3a2e4a;
      --ink-soft: #6d5f80;
      --card: #ffffff;
      --fire: #ff7043;
      --fire-soft: #ffe0d6;
      --ice: #4fc3f7;
      --ice-soft: #d6f1ff;
      --star: #ffca28;
      --star-soft: #fff3cf;
      --spark: #ec6fb0;
      --action: #ff8a4c;
      --guard: #4db38a;
      --brain: #6c8cf5;
      --shadow: 0 6px 0 rgba(58,46,74,0.12), 0 14px 34px rgba(58,46,74,0.18);
      --radius: 26px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      font-family: 'Fredoka', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #aee3ff 0%, #cdeffd 42%, #d8f7d2 100%);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    body { position: fixed; inset: 0; }

    .app {
      height: 100%;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ---------- Top bar ---------- */
    .topbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      /* extra top padding keeps our nav clear of the shared auth user-bar
         (fixed top-right sign-out chip injected by auth.js) */
      padding: 3.2rem 0.85rem 0.6rem;
      z-index: 20;
    }
    .topbar .spacer { flex: 1; }
    .pill {
      display: inline-flex; align-items: center; gap: 0.35rem;
      background: rgba(255,255,255,0.85);
      border: 3px solid #fff;
      border-radius: 99px;
      padding: 0.35rem 0.75rem;
      font-weight: 600;
      font-size: 0.95rem;
      box-shadow: 0 4px 0 rgba(58,46,74,0.08);
      cursor: pointer;
      transition: transform 0.12s;
    }
    .pill:active { transform: scale(0.94); }
    .pill.stars { color: #b8860b; }
    .icon-btn {
      width: 46px; height: 46px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 1.3rem; background: rgba(255,255,255,0.85);
      border: 3px solid #fff; cursor: pointer;
      box-shadow: 0 4px 0 rgba(58,46,74,0.08);
      transition: transform 0.12s;
    }
    .icon-btn:active { transform: scale(0.9); }

    /* PLACEHOLDER */
