<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>⛏️ 마인크래프트 틱택토</title>
  <script src="../auth-config.js"></script>
  <script src="../auth.js"></script>
  <style>
    :root {
      --sky-1: #79c0f2;
      --sky-2: #a7dbff;
      --grass: #7cbd56;
      --grass-dark: #5f9e3f;
      --dirt: #8a5a3b;
      --stone: #b6b6b6;
      --stone-dark: #8a8a8a;
      --stone-light: #d8d8d8;
      --panel: #c6c6c6;
      --panel-dark: #55555a;
      --panel-light: #ffffff;
      --ink: #2b2b2b;
      --wood: #9c6b3f;
      --gold: #f7d64a;
      --creeper: #74b13a;
      --pig: #f0a5b8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      min-height: 100%;
      /* Periwinkle sky (no green ground) so the green grass-block board
         stays clearly distinct from the background. */
      background: linear-gradient(180deg, #6a74c4 0%, #8b96db 24%, #b9c0ee 52%, #dee2f7 100%);
      background-attachment: fixed;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    body { visibility: hidden; }
    body.auth-ok, body.auth-gate { visibility: visible; }

    .wrap {
      max-width: 560px;
      margin: 0 auto;
      padding: 0.9rem 0.9rem 3rem;
    }

    /* ── Topnav ── */
    .topnav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      font-size: 0.72rem;
      color: #2b2b2b;
      margin-bottom: 0.9rem;
      background: rgba(255,255,255,0.55);
      border-radius: 10px;
      padding: 0.4rem 0.7rem;
      backdrop-filter: blur(3px);
    }
    .topnav a { color: inherit; text-decoration: none; font-weight: 600; opacity: 0.85; }
    .topnav a:hover { opacity: 1; }
    .topnav .stamp { opacity: 0.65; }

    /* ── Blocky title ── */
    .title {
      text-align: center;
      margin-bottom: 0.85rem;
    }
    .title h1 {
      font-size: clamp(1.4rem, 6.5vw, 2.1rem);
      letter-spacing: 0.02em;
      color: #fff;
      font-weight: 800;
      text-shadow:
        2px 2px 0 #3a3a3a, -1px -1px 0 rgba(0,0,0,0.25),
        0 3px 0 #3b3576;
    }
    .title p {
      margin-top: 0.3rem;
      font-size: 0.82rem;
      color: #f0f1ff;
      font-weight: 600;
      text-shadow: 0 1px 2px rgba(30,30,60,0.35);
    }

    /* ── Minecraft-style panel (beveled GUI) ── */
    .mc-panel {
      background: var(--panel);
      border: 3px solid;
      border-color: var(--panel-light) var(--panel-dark) var(--panel-dark) var(--panel-light);
      box-shadow: inset -2px -2px 0 rgba(0,0,0,0.12), inset 2px 2px 0 rgba(255,255,255,0.35), 0 6px 14px rgba(0,0,0,0.18);
      border-radius: 4px;
      padding: 0.85rem;
      margin-bottom: 0.85rem;
    }

    /* ── Minecraft buttons ── */
    .mc-btn {
      font-family: inherit;
      font-weight: 700;
      font-size: 0.82rem;
      color: #fff;
      background: #7f7f86;
      border: 3px solid;
      border-color: #b7b7bd #3f3f45 #3f3f45 #b7b7bd;
      padding: 0.55rem 0.7rem;
      border-radius: 3px;
      cursor: pointer;
      text-shadow: 1px 1px 0 rgba(0,0,0,0.45);
      box-shadow: inset -2px -2px 0 rgba(0,0,0,0.2), inset 2px 2px 0 rgba(255,255,255,0.25);
      transition: filter 0.08s, transform 0.05s;
      user-select: none;
      -webkit-user-select: none;
    }
    .mc-btn:hover { filter: brightness(1.1); }
    .mc-btn:active { transform: translateY(1px); filter: brightness(0.95); }
    .mc-btn.small { font-size: 0.74rem; padding: 0.4rem 0.55rem; }
    .mc-btn[aria-pressed="true"], .mc-btn.on {
      background: #5aa73a;
      border-color: #86d15f #2f6d1f #2f6d1f #86d15f;
    }
    .mc-btn.gold {
      background: #d9a520;
      border-color: #ffd766 #916708 #916708 #ffd766;
    }

    /* ── Setup rows ── */
    .setup-row { margin-bottom: 0.7rem; }
    .setup-row:last-child { margin-bottom: 0; }
    .setup-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: #34343a;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.4rem;
      opacity: 0.75;
    }
    .btn-group { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .btn-group .mc-btn { flex: 1 1 0; min-width: 0; }
    #diff-row.hidden { display: none; }

    /* ── Scoreboard ── */
    .scoreboard {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 0.5rem;
      text-align: center;
    }
    .score-side { display: flex; flex-direction: column; align-items: center; gap: 0.25rem; }
    .score-side .who { display: flex; align-items: center; gap: 0.35rem; font-weight: 700; font-size: 0.82rem; }
    .score-side .who svg { width: 26px; height: 26px; }
    .score-num {
      font-size: 1.7rem; font-weight: 800; line-height: 1; color: #222;
      text-shadow: 1px 1px 0 rgba(255,255,255,0.6);
    }
    .score-mid { font-size: 0.7rem; color: #55555a; font-weight: 700; }
    .score-mid .draw-num { display: block; font-size: 1.1rem; color: #333; }
    .score-side.active .who {
      background: rgba(255,255,255,0.6);
      border-radius: 999px;
      padding: 0.1rem 0.5rem;
      box-shadow: 0 0 0 2px var(--gold);
    }

    /* ── Status ── */
    .status {
      text-align: center;
      font-weight: 800;
      font-size: 1rem;
      min-height: 1.5rem;
      color: #23331a;
      display: flex; align-items: center; justify-content: center; gap: 0.4rem;
    }
    .status svg { width: 24px; height: 24px; }
    .status.win { color: #b8860b; font-size: 1.15rem; }

    /* ── Board ── */
    .board-wrap { position: relative; margin: 0 auto; max-width: 420px; }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 6px;
      background: #6b4a2f;
      border: 4px solid;
      border-color: #b98a5e #4a3117 #4a3117 #b98a5e;
      border-radius: 6px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.28);
      touch-action: manipulation;
    }
    .cell {
      position: relative;
      aspect-ratio: 1 / 1;
      border: none;
      padding: 0;
      cursor: pointer;
      border-radius: 3px;
      overflow: hidden;
      image-rendering: pixelated;
      box-shadow: inset -3px -3px 0 rgba(0,0,0,0.22), inset 3px 3px 0 rgba(255,255,255,0.18);
      background-size: cover;
      background-position: center;
      transition: transform 0.06s;
      -webkit-tap-highlight-color: transparent;
    }
    .cell:not(.filled):hover::after {
      content: "";
      position: absolute; inset: 0;
      background: rgba(255,255,255,0.22);
    }
    .cell:not(.filled):active { transform: scale(0.96); }
    .cell.filled { cursor: default; }
    .cell .marker {
      position: absolute; inset: 12%;
      width: 76%; height: 76%;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.35));
      animation: pop 0.28s cubic-bezier(.2,1.4,.5,1);
    }
    @keyframes pop {
      0% { transform: scale(0) rotate(-12deg); }
      70% { transform: scale(1.15) rotate(4deg); }
      100% { transform: scale(1) rotate(0); }
    }
    .cell.win {
      box-shadow: inset 0 0 0 3px var(--gold), inset -3px -3px 0 rgba(0,0,0,0.22);
      animation: winpulse 0.7s ease-in-out infinite alternate;
    }
    @keyframes winpulse {
      from { filter: brightness(1); }
      to   { filter: brightness(1.35); }
    }
    .board.locked .cell:not(.filled) { cursor: default; }

    /* ── Controls ── */
    .controls {
      display: flex; gap: 0.5rem; margin-top: 0.85rem; justify-content: center; flex-wrap: wrap;
    }

    /* ── Win banner ── */
    .banner {
      position: fixed; inset: 0;
      display: none;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.45);
      z-index: 50;
      padding: 1rem;
    }
    .banner.show { display: flex; }
    .banner .card {
      background: var(--panel);
      border: 4px solid;
      border-color: var(--panel-light) var(--panel-dark) var(--panel-dark) var(--panel-light);
      border-radius: 6px;
      padding: 1.6rem 1.4rem;
      text-align: center;
      max-width: 320px; width: 100%;
      box-shadow: 0 12px 40px rgba(0,0,0,0.4);
      animation: pop 0.35s cubic-bezier(.2,1.4,.5,1);
    }
    .banner .card svg { width: 72px; height: 72px; margin-bottom: 0.5rem; }
    .banner .card h2 { font-size: 1.4rem; color: #2b2b2b; margin-bottom: 0.3rem; }
    .banner .card p { font-size: 0.85rem; color: #55555a; margin-bottom: 1.1rem; }
    .banner .card .mc-btn { width: 100%; }

    /* ── Confetti ── */
    .confetti-block {
      position: fixed; top: -24px; width: 16px; height: 16px;
      z-index: 60; pointer-events: none; border-radius: 2px;
      box-shadow: inset -2px -2px 0 rgba(0,0,0,0.25);
    }
    @keyframes fall {
      to { transform: translateY(110vh) rotate(540deg); opacity: 0.9; }
    }

    footer {
      text-align: center;
      font-size: 0.72rem;
      color: #3a3a66;
      margin-top: 1.2rem;
      font-weight: 600;
    }

    @media (max-width: 380px) {
      .score-num { font-size: 1.4rem; }
      .mc-btn { font-size: 0.76rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="topnav">
      <a href="../">← 카탈로그</a>
      <span class="stamp">페이지 업데이트: 2026-07-28 01:42 KST</span>
    </nav>

    <div class="title">
      <h1>⛏️ 마인크래프트 틱택토</h1>
      <p>크리퍼와 꿀꿀이의 블록 대결! 한 줄을 먼저 완성하세요 🟩🐷</p>
    </div>

    <!-- Setup -->
    <div class="mc-panel">
      <div class="setup-row">
        <div class="setup-label">게임 모드</div>
        <div class="btn-group" id="mode-row">
          <button class="mc-btn" data-mode="cpu">🤖 컴퓨터와 대전</button>
          <button class="mc-btn" data-mode="2p">👬 둘이서 대전</button>
        </div>
      </div>
      <div class="setup-row hidden" id="diff-row">
        <div class="setup-label">컴퓨터 난이도</div>
        <div class="btn-group">
          <button class="mc-btn" data-diff="easy">🟢 하</button>
          <button class="mc-btn" data-diff="med">🟡 중</button>
          <button class="mc-btn" data-diff="hard">🔴 상</button>
        </div>
      </div>
    </div>

    <!-- Scoreboard -->
    <div class="mc-panel">
      <div class="scoreboard">
        <div class="score-side" id="side-C">
          <div class="who"><span id="face-C"></span><span id="name-C">크리퍼</span></div>
          <div class="score-num" id="score-C">0</div>
        </div>
        <div class="score-mid">
          무승부
          <span class="draw-num" id="score-D">0</span>
        </div>
        <div class="score-side" id="side-P">
          <div class="who"><span id="face-P"></span><span id="name-P">꿀꿀이</span></div>
          <div class="score-num" id="score-P">0</div>
        </div>
      </div>
    </div>

    <!-- Status -->
    <div class="status" id="status"></div>

    <!-- Board -->
    <div class="board-wrap">
      <div class="board" id="board" role="grid" aria-label="틱택토 판"></div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="mc-btn gold" id="btn-new">🌱 새 게임</button>
      <button class="mc-btn small" id="btn-reset">🔄 점수 초기화</button>
      <button class="mc-btn small" id="btn-sound" aria-pressed="true">🔊 소리</button>
    </div>

    <footer>블록을 놓아 가로·세로·대각선 한 줄을 완성하면 승리! · 진행 상황은 브라우저에 저장됩니다</footer>
  </div>

  <!-- Win banner -->
  <div class="banner" id="banner">
    <div class="card">
      <div id="banner-face"></div>
      <h2 id="banner-title">승리!</h2>
      <p id="banner-sub"></p>
      <button class="mc-btn gold" id="banner-again">한 판 더! 🌱</button>
    </div>
  </div>

  <script>
  (function () {
    "use strict";

    // ── Pixel-art markers (rendered as inline SVG) ──────────────────
    // '.' = transparent
    var PAL_CREEPER = { ".": null, g: "#74b13a", G: "#5f9e2f", k: "#1c3a12" };
    var CREEPER = [
      "gGgggGgg",
      "gGgggGGg",
      "gkkggkkg",
      "gkkggkkg",
      "gggkkggg",
      "gGkkkkGg",
      "ggkggkgg",
      "ggkggkgg"
    ];

    var PAL_PIG = { ".": null, p: "#f0a5b8", P: "#e58aa0", s: "#d9738d", n: "#7a3a4a", k: "#3a2630" };
    var PIG = [
      "pPppppPp",
      "pppppppp",
      "pkppppkp",
      "pkppppkp",
      "ppsssspp",
      "psnssnsp",
      "pssssssp",
      "ppsssspp"
    ];

    // Grass block texture (for empty cells), 8x8, encoded as a data URI.
    var PAL_GRASS = { G: "#7cbd56", g: "#6aa845", l: "#8fd06a", D: "#8a5a3b", d: "#734a30", b: "#9c6b45" };
    var GRASS = [
      "GlGGgGGl",
      "GGgGGGlG",
      "gGGlGGGg",
      "GDgDDgDG",
      "DdDbDDdD",
      "bDDdDbDD",
      "DDbDDdDb",
      "dDDbDdDb"
    ];

    function pixelSVG(map, pal) {
      var rows = map.length, cols = map[0].length, rects = "";
      for (var y = 0; y < rows; y++) {
        for (var x = 0; x < cols; x++) {
          var c = pal[map[y][x]];
          if (!c) continue;
          rects += '<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="' + c + '"/>';
        }
      }
      return '<svg viewBox="0 0 ' + cols + ' ' + rows + '" xmlns="http://www.w3.org/2000/svg" ' +
             'shape-rendering="crispEdges" width="100%" height="100%">' + rects + '</svg>';
    }

    var SVG_CREEPER = pixelSVG(CREEPER, PAL_CREEPER);
    var SVG_PIG = pixelSVG(PIG, PAL_PIG);
    var GRASS_URI = "url('data:image/svg+xml," +
      encodeURIComponent(pixelSVG(GRASS, PAL_GRASS)) + "')";

    function markerSVG(player) { return player === "C" ? SVG_CREEPER : SVG_PIG; }

    // ── State ───────────────────────────────────────────────────────
    var WIN_LINES = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];
    var STORE_KEY = "tictactoe.mc.v1";

    var state = {
      board: new Array(9).fill(null),
      current: "C",       // 'C' creeper (goes first), 'P' pig
      mode: "cpu",        // 'cpu' | '2p'
      diff: "med",        // 'easy' | 'med' | 'hard'
      over: false,
      lock: false,
      scores: { C: 0, P: 0, D: 0 },
      muted: false
    };

    // ── Persistence ─────────────────────────────────────────────────
    function save() {
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify({
          mode: state.mode, diff: state.diff, scores: state.scores, muted: state.muted
        }));
      } catch (e) {}
    }
    function load() {
      try {
        var raw = localStorage.getItem(STORE_KEY);
        if (!raw) return;
        var d = JSON.parse(raw);
        if (d.mode) state.mode = d.mode;
        if (d.diff) state.diff = d.diff;
        if (d.scores) state.scores = d.scores;
        if (typeof d.muted === "boolean") state.muted = d.muted;
      } catch (e) {}
    }

    // ── Sound (Web Audio) ───────────────────────────────────────────
    var actx = null;
    var audioUnlocked = false;
    function makeCtx() {
      if (!actx) {
        try { actx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch (e) { return null; }
      }
      return actx;
    }
    function ac() {
      if (state.muted) return null;
      var ctx = makeCtx();
      if (ctx && ctx.state === "suspended") { try { ctx.resume(); } catch (e) {} }
      return ctx;
    }
    // Mobile browsers (esp. iOS Safari) create the AudioContext in a
    // "suspended" state and only let it start from a real user gesture —
    // the async resume() alone isn't enough, so on the first gesture we
    // also start a silent node to fully unlock it. Runs on every gesture
    // (cheap) so audio also recovers if the context is suspended again
    // after the tab is backgrounded.
    function unlockAudio() {
      if (state.muted) return;
      var ctx = makeCtx();
      if (!ctx) return;
      if (ctx.state === "suspended") { try { ctx.resume(); } catch (e) {} }
      if (!audioUnlocked) {
        try {
          var o = ctx.createOscillator(), g = ctx.createGain();
          g.gain.value = 0.00001;
          o.connect(g); g.connect(ctx.destination);
          o.start(); o.stop(ctx.currentTime + 0.02);
          audioUnlocked = true;
        } catch (e) {}
      }
    }
    ["pointerdown", "touchstart", "mousedown", "keydown"].forEach(function (ev) {
      window.addEventListener(ev, unlockAudio, { passive: true });
    });
    function beep(freq, dur, type, when, gain) {
      var ctx = ac(); if (!ctx) return;
      var t = ctx.currentTime + (when || 0);
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type || "square";
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(gain || 0.16, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + dur + 0.02);
    }
    function sndPlace() { beep(180, 0.09, "square", 0, 0.14); beep(90, 0.12, "triangle", 0, 0.1); }
    function sndClick() { beep(520, 0.05, "square", 0, 0.08); }
    function sndWin() {
      [523, 659, 784, 1046].forEach(function (f, i) { beep(f, 0.16, "square", i * 0.11, 0.15); });
    }
    function sndDraw() { beep(300, 0.18, "triangle", 0, 0.12); beep(200, 0.22, "triangle", 0.12, 0.12); }

    // ── DOM refs ────────────────────────────────────────────────────
    var boardEl = document.getElementById("board");
    var statusEl = document.getElementById("status");
    var bannerEl = document.getElementById("banner");

    // ── Build board ─────────────────────────────────────────────────
    var cells = [];
    for (var i = 0; i < 9; i++) {
      var c = document.createElement("button");
      c.className = "cell";
      c.style.backgroundImage = GRASS_URI;
      c.setAttribute("role", "gridcell");
      c.setAttribute("aria-label", "빈 칸 " + (i + 1));
      c.dataset.idx = i;
      c.addEventListener("click", onCellClick);
      boardEl.appendChild(c);
      cells.push(c);
    }

    // ── Names / faces ───────────────────────────────────────────────
    function nameOf(player) {
      if (player === "C") return "크리퍼";
      return state.mode === "cpu" ? "컴퓨터" : "꿀꿀이";
    }
    function refreshIdentity() {
      document.getElementById("face-C").innerHTML =
        '<span style="display:inline-block;width:26px;height:26px">' + SVG_CREEPER + '</span>';
      document.getElementById("face-P").innerHTML =
        '<span style="display:inline-block;width:26px;height:26px">' + SVG_PIG + '</span>';
      document.getElementById("name-C").textContent = nameOf("C");
      document.getElementById("name-P").textContent = nameOf("P");
    }

    // ── Rendering ───────────────────────────────────────────────────
    function render() {
      for (var i = 0; i < 9; i++) {
        var cell = cells[i], v = state.board[i];
        if (v && !cell.classList.contains("filled")) {
          cell.classList.add("filled");
          cell.innerHTML = '<span class="marker">' + markerSVG(v) + '</span>';
          cell.setAttribute("aria-label", nameOf(v) + " 블록");
        }
      }
      document.getElementById("score-C").textContent = state.scores.C;
      document.getElementById("score-P").textContent = state.scores.P;
      document.getElementById("score-D").textContent = state.scores.D;

      document.getElementById("side-C").classList.toggle("active", !state.over && state.current === "C");
      document.getElementById("side-P").classList.toggle("active", !state.over && state.current === "P");

      // mode / diff button states
      Array.prototype.forEach.call(document.querySelectorAll("[data-mode]"), function (b) {
        b.classList.toggle("on", b.dataset.mode === state.mode);
      });
      Array.prototype.forEach.call(document.querySelectorAll("[data-diff]"), function (b) {
        b.classList.toggle("on", b.dataset.diff === state.diff);
      });
      document.getElementById("diff-row").classList.toggle("hidden", state.mode !== "cpu");
    }

    function setStatus() {
      if (state.over) return;
      var isCpuTurn = state.mode === "cpu" && state.current === "P";
      var label = isCpuTurn ? "컴퓨터가 생각하는 중…" : nameOf(state.current) + " 차례!";
      statusEl.className = "status";
      statusEl.innerHTML =
        '<span style="display:inline-block;width:24px;height:24px">' + markerSVG(state.current) + '</span>' + label;
    }

    // ── Win logic ───────────────────────────────────────────────────
    function winnerOf(b) {
      for (var i = 0; i < WIN_LINES.length; i++) {
        var L = WIN_LINES[i];
        if (b[L[0]] && b[L[0]] === b[L[1]] && b[L[1]] === b[L[2]]) {
          return { player: b[L[0]], line: L };
        }
      }
      return null;
    }
    function isFull(b) { return b.every(function (x) { return x; }); }

    // ── Turn handling ───────────────────────────────────────────────
    function onCellClick(e) {
      var idx = +e.currentTarget.dataset.idx;
      if (state.over || state.lock || state.board[idx]) return;
      if (state.mode === "cpu" && state.current === "P") return; // not human's turn
      place(idx, state.current);
    }

    function place(idx, player) {
      state.board[idx] = player;
      sndPlace();
      render();

      var win = winnerOf(state.board);
      if (win) return finish(win);
      if (isFull(state.board)) return finish(null);

      state.current = player === "C" ? "P" : "C";
      setStatus();
      render();

      if (state.mode === "cpu" && state.current === "P" && !state.over) {
        state.lock = true;
        boardEl.classList.add("locked");
        setTimeout(aiMove, 480);
      }
    }

    function finish(win) {
      state.over = true;
      state.lock = true;
      boardEl.classList.add("locked");

      if (win) {
        win.line.forEach(function (i) { cells[i].classList.add("win"); });
        state.scores[win.player]++;
        sndWin();
        confetti(win.player);
        statusEl.className = "status win";
        statusEl.innerHTML =
          '<span style="display:inline-block;width:26px;height:26px">' + markerSVG(win.player) +
          '</span>' + nameOf(win.player) + " 승리! 🎉";
        showBanner(win.player);
      } else {
        state.scores.D++;
        sndDraw();
        statusEl.className = "status";
        statusEl.textContent = "🤝 무승부! 좋은 승부였어요";
        showBanner(null);
      }
      save();
      render();
    }

    // ── AI ──────────────────────────────────────────────────────────
    function emptyCells(b) {
      var r = [];
      for (var i = 0; i < 9; i++) if (!b[i]) r.push(i);
      return r;
    }
    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    // Return index that lets `player` win immediately, or null.
    function winningMove(b, player) {
      var empties = emptyCells(b);
      for (var i = 0; i < empties.length; i++) {
        var idx = empties[i];
        b[idx] = player;
        var w = winnerOf(b);
        b[idx] = null;
        if (w) return idx;
      }
      return null;
    }

    function aiEasy(b) { return pick(emptyCells(b)); }

    function aiMedium(b) {
      // Mostly smart, sometimes careless — beatable but fun.
      if (Math.random() < 0.25) return pick(emptyCells(b));
      var winIt = winningMove(b, "P"); if (winIt != null) return winIt;
      var block = winningMove(b, "C"); if (block != null) return block;
      if (!b[4]) return 4;
      var corners = [0, 2, 6, 8].filter(function (i) { return !b[i]; });
      if (corners.length) return pick(corners);
      return pick(emptyCells(b));
    }

    // Minimax — computer 'P' maximizes, human 'C' minimizes. Unbeatable.
    function minimax(b, depth, isMax) {
      var w = winnerOf(b);
      if (w) return w.player === "P" ? 10 - depth : depth - 10;
      if (isFull(b)) return 0;
      var empties = emptyCells(b), best, i, v;
      if (isMax) {
        best = -Infinity;
        for (i = 0; i < empties.length; i++) {
          b[empties[i]] = "P";
          v = minimax(b, depth + 1, false);
          b[empties[i]] = null;
          if (v > best) best = v;
        }
      } else {
        best = Infinity;
        for (i = 0; i < empties.length; i++) {
          b[empties[i]] = "C";
          v = minimax(b, depth + 1, true);
          b[empties[i]] = null;
          if (v < best) best = v;
        }
      }
      return best;
    }
    function aiHard(b) {
      var empties = emptyCells(b);
      var best = -Infinity, moves = [];
      for (var i = 0; i < empties.length; i++) {
        b[empties[i]] = "P";
        var v = minimax(b, 0, false);
        b[empties[i]] = null;
        if (v > best) { best = v; moves = [empties[i]]; }
        else if (v === best) moves.push(empties[i]);
      }
      return pick(moves);
    }

    function aiMove() {
      if (state.over) return;
      var idx;
      if (state.diff === "easy") idx = aiEasy(state.board);
      else if (state.diff === "hard") idx = aiHard(state.board);
      else idx = aiMedium(state.board);

      state.lock = false;
      boardEl.classList.remove("locked");
      place(idx, "P");
    }

    // ── Banner ──────────────────────────────────────────────────────
    function showBanner(player) {
      var faceWrap = document.getElementById("banner-face");
      var titleEl = document.getElementById("banner-title");
      var subEl = document.getElementById("banner-sub");
      if (player) {
        faceWrap.innerHTML = '<span style="display:inline-block;width:72px;height:72px">' + markerSVG(player) + '</span>';
        titleEl.textContent = nameOf(player) + " 승리! 🎉";
        subEl.textContent = "한 줄을 완성했어요!";
      } else {
        faceWrap.innerHTML = "🤝";
        faceWrap.style.fontSize = "3.4rem";
        titleEl.textContent = "무승부!";
        subEl.textContent = "판이 가득 찼어요. 다시 도전!";
      }
      setTimeout(function () { bannerEl.classList.add("show"); }, 650);
    }
    function hideBanner() { bannerEl.classList.remove("show"); }

    // ── Confetti (falling Minecraft blocks) ─────────────────────────
    function confetti(player) {
      var colors = player === "C"
        ? ["#74b13a", "#5f9e2f", "#8fd06a", "#f7d64a"]
        : ["#f0a5b8", "#e58aa0", "#d9738d", "#f7d64a"];
      for (var i = 0; i < 22; i++) {
        (function (n) {
          var el = document.createElement("div");
          el.className = "confetti-block";
          el.style.left = Math.random() * 100 + "vw";
          el.style.background = colors[n % colors.length];
          var dur = 1.4 + Math.random() * 1.1;
          el.style.animation = "fall " + dur + "s linear " + (Math.random() * 0.3) + "s forwards";
          document.body.appendChild(el);
          setTimeout(function () { el.remove(); }, (dur + 0.4) * 1000);
        })(i);
      }
    }

    // ── New round / reset ───────────────────────────────────────────
    function newRound() {
      hideBanner();
      state.board = new Array(9).fill(null);
      state.current = "C";
      state.over = false;
      state.lock = false;
      boardEl.classList.remove("locked");
      for (var i = 0; i < 9; i++) {
        cells[i].className = "cell";
        cells[i].style.backgroundImage = GRASS_URI;
        cells[i].innerHTML = "";
        cells[i].setAttribute("aria-label", "빈 칸 " + (i + 1));
      }
      setStatus();
      render();
    }

    function resetScores() {
      state.scores = { C: 0, P: 0, D: 0 };
      save();
      render();
    }

    // ── Wire up controls ────────────────────────────────────────────
    Array.prototype.forEach.call(document.querySelectorAll("[data-mode]"), function (b) {
      b.addEventListener("click", function () {
        sndClick();
        state.mode = b.dataset.mode;
        save();
        refreshIdentity();
        newRound();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-diff]"), function (b) {
      b.addEventListener("click", function () {
        sndClick();
        state.diff = b.dataset.diff;
        save();
        newRound();
      });
    });
    document.getElementById("btn-new").addEventListener("click", function () { sndClick(); newRound(); });
    document.getElementById("banner-again").addEventListener("click", function () { sndClick(); newRound(); });
    document.getElementById("btn-reset").addEventListener("click", function () { sndClick(); resetScores(); });
    document.getElementById("btn-sound").addEventListener("click", function () {
      state.muted = !state.muted;
      this.setAttribute("aria-pressed", String(!state.muted));
      this.textContent = state.muted ? "🔇 소리" : "🔊 소리";
      save();
      if (!state.muted) sndClick();
    });

    // ── Boot ────────────────────────────────────────────────────────
    load();
    var soundBtn = document.getElementById("btn-sound");
    soundBtn.setAttribute("aria-pressed", String(!state.muted));
    soundBtn.textContent = state.muted ? "🔇 소리" : "🔊 소리";
    refreshIdentity();
    render();
    newRound();
  })();
  </script>
</body>
</html>
